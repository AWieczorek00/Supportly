<div class="page-container">
  <form [formGroup]="agreementForm" (ngSubmit)="submitForm()">
    <mat-accordion [multi]="true">

      <mat-expansion-panel expanded="true" class="promont-panel">
        <mat-expansion-panel-header>
          <mat-panel-title>Firma</mat-panel-title>
        </mat-expansion-panel-header>

        <div class="form-grid-3">
          <mat-form-field appearance="outline">
            <mat-label>Firma</mat-label>
            <input type="text" matInput formControlName="client" [matAutocomplete]="auto">
            <mat-autocomplete #auto="matAutocomplete" [displayWith]="displayClient"
                              (optionSelected)="onClientSelected($event.option.value)">
              <mat-option *ngFor="let client of filteredClients$ | async" [value]="client">
                {{ client.company?.name }}
              </mat-option>
            </mat-autocomplete>
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>NIP</mat-label>
            <input matInput formControlName="nip" required>
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>REGON</mat-label>
            <input matInput formControlName="regon" required>
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>Numer telefonu</mat-label>
            <input matInput formControlName="phoneNumber" required>
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>Email</mat-label>
            <input matInput type="email" formControlName="addressEmail" required>
          </mat-form-field>
        </div>
      </mat-expansion-panel>

      <mat-expansion-panel expanded="true" class="promont-panel">
        <mat-expansion-panel-header>
          <mat-panel-title>Adres firmy</mat-panel-title>
        </mat-expansion-panel-header>

        <div class="form-grid-3">
          <mat-form-field appearance="outline">
            <mat-label>Miasto (City)</mat-label>
            <input matInput formControlName="city" required>
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>Ulica (Street)</mat-label>
            <input matInput formControlName="street" required>
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>Numer budynku</mat-label>
            <input matInput formControlName="buildingNumber" required>
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>Numer lokalu</mat-label>
            <input matInput type="number" formControlName="apartmentNumber" required>
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>Kod pocztowy</mat-label>
            <input matInput formControlName="postalCode" required>
          </mat-form-field>
        </div>
      </mat-expansion-panel>

      <mat-expansion-panel expanded="true" class="promont-panel">
        <mat-expansion-panel-header>
          <mat-panel-title>Umowa</mat-panel-title>
        </mat-expansion-panel-header>

        <div class="form-grid-3">
          <mat-form-field appearance="outline">
            <mat-label>Data początkowa</mat-label>
            <input matInput type="date" formControlName="dateFrom" required>
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>Data końcowa</mat-label>
            <input matInput type="date" formControlName="dateTo" required>
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>Okres (w miesiącach)</mat-label>
            <input matInput type="number" formControlName="period" required>
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>Koszt za godzinę roboczą</mat-label>
            <input matInput type="number" formControlName="costForServicePerHour" required>
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>Numer umowy</mat-label>
            <input matInput formControlName="agreementNumber" required>
          </mat-form-field>
        </div>
      </mat-expansion-panel>
    </mat-accordion>

    <div class="action-buttons">
      <button mat-raised-button color="primary" type="submit" [disabled]="agreementForm.invalid">
        Zapisz umowę
      </button>
    </div>
  </form>
</div>
