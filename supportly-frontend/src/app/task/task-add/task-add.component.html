<div class="custom-dialog-container">
  <div class="dialog-header bg-promont-blue">
    <h2 mat-dialog-title class="m-0 text-white">Dodaj nowe zadanie</h2>
  </div>

  <div mat-dialog-content class="dialog-content">
    <form [formGroup]="form" class="form-grid">

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Nazwa zadania</mat-label>
        <input matInput formControlName="name" placeholder="np. Przegląd palnika">
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Zamówienie</mat-label>
        <input matInput formControlName="orderSearch" [matAutocomplete]="autoOrder" placeholder="Wyszukaj zamówienie">
        <mat-autocomplete #autoOrder="matAutocomplete" [displayWith]="displayOrder" (optionSelected)="onOrderSelected($event.option.value)">
          <mat-option *ngFor="let o of filteredOrders$ | async" [value]="o">
            {{ o.client?.company?.name }} - {{ o.agreementNumber }}
          </mat-option>
        </mat-autocomplete>
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width span-two-cols">
        <mat-label>Przypisani pracownicy</mat-label>
        <mat-select formControlName="employees" multiple placeholder="Wybierz z listy">
          <mat-option *ngFor="let emp of allEmployees" [value]="emp">
            {{ emp.firstName }} {{ emp.lastName }}
          </mat-option>
        </mat-select>
      </mat-form-field>

      <div class="checkbox-container span-two-cols">
        <mat-checkbox formControlName="done" color="primary">Oznacz jako zakończone od razu</mat-checkbox>
      </div>

    </form>
  </div>

  <div mat-dialog-actions align="end" class="dialog-footer">
    <button mat-button (click)="cancel()">Anuluj</button>
    <button mat-raised-button color="primary" (click)="submit()" [disabled]="form.invalid">Zapisz zadanie</button>
  </div>
</div>
